name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Name
        id: vars
        run: |
          # Wenn es ein Tag ist, nimm den Namen. Wenn nicht, nimm 'latest-dev'
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Nur pushen, wenn es wirklich ein Tag ist
          push: ${{ steps.vars.outputs.is_tag == 'true' }}
          tags: |
            ghcr.io/mg-wesel-gmbh/freshware:${{ steps.vars.outputs.tag }}
            ghcr.io/mg-wesel-gmbh/freshware:latest